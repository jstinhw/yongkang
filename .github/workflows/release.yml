name: Release

# A vX.Y.Z tag is a release: checked, built with Developer ID, notarized, and published with its
# Sparkle appcast and dSYMs as a release of this repo, which the website and every installed copy
# download from. docs/release.md has the one-time setup and each secret.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# Two tags at once would race for "latest", which is what the feed and the download link follow.
concurrency: release

# Three jobs, so each token exists only where it is used. `build` runs `make check`, the build
# and every package's code, with the read-only token above. `attest` alone can mint the OIDC
# token Sigstore signs with, and runs nothing but GitHub's own pinned actions. `publish` alone
# can write a release. The files go from one to the next as this run's artifact.
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build number is the commit count
          # Off disk, so nothing `make check` or the build runs finds even this read-only token.
          persist-credentials: false

      # First, so a tag with nothing to say fails in seconds rather than after notarizing.
      - name: Notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p .build/release
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > .build/release/notes.md
          grep -q '[^[:space:]]' .build/release/notes.md \
            || { echo "::error::CHANGELOG.md has no notes under ## [$version]"; exit 1; }

      - run: make check

      # A throwaway keychain holding only the Developer ID identity; the runner is discarded after.
      - name: Signing identity
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          # Split on purpose: each keychain already in the search list is its own argument.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          test -n "$identity" || { echo "::error::DEVELOPER_ID_P12 holds no Developer ID Application identity"; exit 1; }
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"

      # Xcode 26 compiles SwiftTerm's shaders, and the toolchain for them is a separate download.
      - run: xcodebuild -downloadComponent MetalToolchain

      - name: Build, notarize, staple
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          make release VERSION="${GITHUB_REF_NAME#v}" IDENTITY="$IDENTITY" TEAM="$TEAM" \
            NOTARY="--key $RUNNER_TEMP/notary.p8 --key-id $NOTARY_KEY_ID --issuer $NOTARY_ISSUER_ID"

      # One item: the release just built. Its version, build and minimum macOS are read from the
      # app itself, so the feed can't disagree with what it offers. `sign_update` came down with
      # the Sparkle package during `make check`.
      - name: Appcast
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          plist=.build/export/Yongkang.app/Contents/Info.plist
          read_plist() { /usr/libexec/PlistBuddy -c "Print $1" "$plist"; }
          signature=$(printf '%s' "$SPARKLE_KEY" \
            | .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - .build/release/Yongkang.dmg)
          cat > .build/release/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Yongkang</title>
              <item>
                <title>Yongkang $(read_plist CFBundleShortVersionString)</title>
                <pubDate>$(date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>$(read_plist CFBundleVersion)</sparkle:version>
                <sparkle:shortVersionString>$(read_plist CFBundleShortVersionString)</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>$(read_plist LSMinimumSystemVersion)</sparkle:minimumSystemVersion>
                <description sparkle:format="markdown"><![CDATA[
          $(cat .build/release/notes.md)
                ]]></description>
                <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Yongkang.dmg"
                  type="application/octet-stream" $signature/>
              </item>
            </channel>
          </rss>
          XML
          xmllint --noout .build/release/appcast.xml

      # What turns a crash report's addresses back into function names.
      - name: dSYMs
        run: |
          ditto -c -k --keepParent .build/xcode/Yongkang.xcarchive/dSYMs \
            ".build/release/Yongkang-$GITHUB_REF_NAME-dSYMs.zip"

      # What lets anyone check a download is the DMG this run built: its SHA-256 beside it, and a
      # build-provenance attestation of the same bytes (the attest job). Both come after the DMG
      # is notarized and stapled, so they cover the file users get. The website's download check
      # reads `Yongkang.dmg.sha256` by that name.
      - name: Checksum
        working-directory: .build/release
        run: shasum -a 256 Yongkang.dmg > Yongkang.dmg.sha256

      # The DMG, its checksum, the appcast, the dSYMs and the notes. An artifact can't be
      # replaced once uploaded, and download-artifact refuses one whose digest has changed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: .build/release
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # the OIDC token Sigstore signs the attestation with
      attestations: write # where GitHub keeps the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Yongkang.dmg

  # After attest, so a release never goes out without its attestation.
  publish:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release itself
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      # One release, published at once: never a draft or a prerelease, because `latest` skips
      # those, and `latest` is what SUFeedURL and the website's download link read. How to verify
      # goes on the release's notes only: the update window's are the appcast's, and Sparkle
      # checks its own signature.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat notes.md - > "$RUNNER_TEMP/release-notes.md" <<MD

          ### Verify the download

          With \`Yongkang.dmg.sha256\` in the same folder as the DMG:

              shasum -a 256 -c Yongkang.dmg.sha256
              gh attestation verify Yongkang.dmg --repo $GITHUB_REPOSITORY
          MD
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            Yongkang.dmg Yongkang.dmg.sha256 appcast.xml "Yongkang-$GITHUB_REF_NAME-dSYMs.zip" \
            --title "Yongkang ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.md"

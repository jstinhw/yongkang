name: CI

# The same `make check` the pre-push hook runs, for every pull request and for main. `main`'s
# ruleset requires this job by its id, `check`: renamed, every pull request waits on a check
# that never comes until the ruleset names the new one.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make check

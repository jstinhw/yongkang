# Weekly pull requests for Sparkle and SwiftTerm, and for the actions pinned by commit in
# .github/workflows. Each one runs CI like any other.
version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    # SwiftTerm 1.99 is 2.0's preview, which Package.swift caps below.
    ignore:
      - dependency-name: github.com/migueldeicaza/swiftterm
        versions: [">= 1.99.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
